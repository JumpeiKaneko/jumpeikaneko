  <section class="hero container">

    <h1 class="hero__title" data-scramble>大学生の放課後ミュージアム</h1>
    <p class="project-head__meta">東京都美術館「とびらプロジェクト」関連企画</p>
  </section>

  <section class="section container reveal">
    <div class="heading">
      <span class="heading__watermark">01</span>
      <div>
        <h2 class="heading__title" data-scramble>作品要旨</h2>
        <span class="heading__title-en">Concept</span>
      </div>
    </div>
    <div class="profile-text">
      <p>
        大学生が「もし自分たちが美術館の展示レイアウトを考えたら」という視点から、既存の収蔵作品を
        使って展示空間をつくり直すプログラム。作品同士の距離感や動線、照明などを話し合いながら決めていき、
        最終的に一般来場者を迎えて展示室として公開した。
      </p>
    </div>

    <figure class="reveal">
      <img src="https://tobira-project.info/wp-content/uploads/2026/04/de840ae47d4361faddd14d94a7b5e1da.jpg" alt="展示室に飾られた《楽しい地球》望月真理">
      <p class="figcap">出典：とびらプロジェクト公式サイト（本人執筆記事より） ／ 写っている作品は《楽しい地球》望月真理、1995年、個人蔵</p>
    </figure>
  </section>
